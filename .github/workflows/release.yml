name: Build and publish the Docker image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish the release image
    uses: ./.github/workflows/_docker-publish.yml
    with:
      app-version: ${{ github.event.release.tag_name }}
      tags: |
        type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
        type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
        type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
      flavor: latest=auto
      environment: release
    # The release environment holds the push token and needs a reviewer's approval. GitHub's documentation doesn't say a called workflow reads an environment's secrets unless its caller passes secrets, so the caller inherits them
    secrets: inherit
