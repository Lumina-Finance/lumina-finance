name: Pull request checks

on:
  # A patch release is built on a release branch cut from its tag, so its fixes get the same checks
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

# A new push to a pull request cancels the checks still running for its earlier push
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend-image: ${{ steps.image-filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      frontend-image: ${{ steps.image-filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      backend-tests: ${{ steps.tests.outputs.backend }}
      frontend-tests: ${{ steps.tests.outputs.frontend }}
      e2e-specs: ${{ steps.tests.outputs.e2e }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The test file lists compare against the base branch
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Workflow edits exercise the pipeline they change. Each side's lockfile sits in its own
            # folder, so a dependency bump runs that side's checks, the image build and the browser
            # suite, and leaves the other side's checks out
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            # E2E and Docker jobs exercise these tests and composite actions. The browser stack runs
            # the fake bank providers straight from the backend's tests
            docker:
              - 'docker/**'
              - 'e2e/**'
              - 'backend/tests/fake_*/**'
              - '.github/workflows/**'
              - '.github/actions/**'

      # The app image holds none of the backend's or frontend's tests, so a change to those alone
      # builds the same image and gets the same browser result as main. The exclusions need their own
      # step, since the setting reading them applies to every filter of a step
      - name: Filter changes that reach the app image
        id: image-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            backend:
              - 'backend/**'
              - '!backend/tests/**'
              - '!backend/.test_durations'
            frontend:
              - 'frontend/**'
              - '!frontend/tests/**'

      # A suite whose reach holds only changes to its own test files runs just those files, since
      # everything else it runs against matches the base branch. Any other change in its reach, such
      # as a shared helper, fixture, config, lockfile or workflow, or a deleted test, leaves the list
      # empty and the whole suite runs. The patterns admit only letters, digits and separators, since
      # the lists reach shell commands. The browser suite's reach is what the app image and its stack
      # are built from, with the fake bank providers in the backend's tests
      - name: List the test files to run alone
        id: tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Without rename detection a renamed file shows as its deleted old path and its new one, so
          # a helper renamed to a test file's name still runs the whole suite
          changed=$(git diff --name-only --no-renames "origin/${BASE_REF}...HEAD")
          deleted=$(git diff --name-only --no-renames --diff-filter=D "origin/${BASE_REF}...HEAD")

          in_reach() {
            grep -E "$1" <<<"${changed}" || true
          }

          # Prints the files on standard input without the folder in $2, separated by spaces, when
          # each is a test file matching $1 that the pull request keeps, and nothing otherwise
          only_tests() {
            local files
            files=$(cat)
            if [ -z "${files}" ] || grep -vqE "$1" <<<"${files}" || grep -qxFf <(printf '%s\n' "${deleted}") <<<"${files}"; then
              return 0
            fi
            sed "s|^$2/||" <<<"${files}" | paste -sd ' ' -
          }

          # The backend's tests also read the Caddyfile and entrypoint under docker
          backend=$(in_reach '^(backend|docker|\.github)/' \
            | only_tests '^backend/tests/([a-z0-9_]+/)*test_[a-z0-9_]+\.py$' backend)
          frontend=$(in_reach '^(frontend|\.github)/' \
            | only_tests '^frontend/tests/([A-Za-z0-9_-]+/)*[A-Za-z0-9_.-]+\.test\.tsx?$' frontend)
          e2e=$(in_reach '^(backend|frontend|docker|e2e|\.github)/' \
            | awk '!/^frontend\/tests\// && !(/^backend\/tests\// && !/^backend\/tests\/fake_/)' \
            | only_tests '^e2e/tests/[A-Za-z0-9_.-]+\.spec\.ts$' e2e)

          {
            echo "backend=${backend}"
            echo "frontend=${frontend}"
            echo "e2e=${e2e}"
          } | tee -a "${GITHUB_OUTPUT}"

  backend-lint:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/_backend-lint.yml

  # The database, cache and mail catcher images are pulled once per architecture for every job that
  # runs them. The pull starts alongside the image build, for every change that starts such a job
  service-images:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.backend == 'true'
        || needs.changes.outputs.frontend-image == 'true'
        || needs.changes.outputs.docker == 'true' }}
    uses: ./.github/workflows/_service-images.yml
    secrets:
      DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

  # Runs only when the images it loads were pulled
  backend-test:
    needs: [changes, service-images]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/_backend-test.yml
    with:
      tests: ${{ needs.changes.outputs.backend-tests }}

  frontend-lint:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/_frontend-lint.yml

  frontend-test:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/_frontend-test.yml
    with:
      tests: ${{ needs.changes.outputs.frontend-tests }}

  frontend-build:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/_frontend-build.yml

  # The image build starts alongside lint and unit tests rather than after them, so the browser
  # suite that follows it, the longest check, starts sooner. The PR gate still blocks merging on
  # any failed job. A change to the backend's or frontend's tests alone skips the build, and the
  # browser suite with it
  docker-build:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.backend-image == 'true'
        || needs.changes.outputs.frontend-image == 'true'
        || needs.changes.outputs.docker == 'true' }}
    uses: ./.github/workflows/_docker-build.yml
    secrets:
      DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

  # The browser tests' type check and contract tests need no image, so they start at once and a type
  # error shows without waiting for the image build or a browser job's setup
  e2e-check:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.backend-image == 'true'
        || needs.changes.outputs.frontend-image == 'true'
        || needs.changes.outputs.docker == 'true' }}
    uses: ./.github/workflows/_e2e-check.yml

  e2e-test:
    needs: [changes, docker-build, service-images]
    if: ${{ !cancelled() && needs.docker-build.result == 'success' && needs.service-images.result == 'success' }}
    uses: ./.github/workflows/_e2e-test.yml
    with:
      specs: ${{ needs.changes.outputs.e2e-specs }}
    secrets:
      DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

  # Keep this name stable for the repository's required status check
  # Jobs skipped by path filters are allowed, but failures and cancellations block merging
  pr-gate:
    name: PR gate
    needs:
      - changes
      - backend-lint
      - backend-test
      - frontend-lint
      - frontend-test
      - frontend-build
      - docker-build
      - service-images
      - e2e-check
      - e2e-test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required branch passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Branch results: ${results}"
          for result in ${results}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "A required branch did not pass"
              exit 1
            fi
          done
          echo "All required branches passed or were skipped"
