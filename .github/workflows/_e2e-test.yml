name: E2E tests

on:
  workflow_call:
    inputs:
      specs:
        description: Spec files to run alone, relative to e2e and separated by spaces. Empty runs the whole suite
        type: string
        default: ""
      api-elsewhere:
        description: Whether a run of the whole suite also runs it against a stack whose API answers at another address. A run of changed specs always does
        type: boolean
        default: false
    secrets:
      DOCKERHUB_PULL_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  test:
    name: E2E tests (${{ matrix.platform }}, ${{ matrix.projects }}${{ matrix.bank == 'on' && ', bank sync' || '' }}${{ matrix.shards > 1 && format(', {0}/{1}', matrix.shard, matrix.shards) || '' }}${{ matrix.grep && ', tagged tests' || '' }})
    if: ${{ inputs.specs == '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One failed job cancels the others, since the run can no longer pass
      fail-fast: true
      # Every job is listed by hand, since the shard counts differ. They make 17 browser jobs, and the
      # jobs against an API at another address below add 14 more when they run. The organisation's
      # plan runs 20 jobs at once, and the 8 backend test jobs hold 8 of them while the browser jobs
      # start, so a job past the free runners waits for one. Each job's stack starts once, so the
      # tests needing bank sync have jobs of their own, on a stack with the bank providers on, and
      # every other test runs on a stack with none. The shards are sized to the test time measured for
      # each part: about 2,500 seconds of desktop tests with no bank provider, 680 of desktop bank
      # sync tests, 240 of tablet and 215 of phone tests with no bank provider and 245 of tablet and
      # phone bank sync tests together. Every job then spends 215 to 245 seconds in its tests
      matrix:
        include:
          # The one arm64 job, at desktop with only the tests tagged `ON_ARM64` in e2e/support/sizes.ts.
          # They cover the parts of the image compiled for the processor type. It passes no
          # `--pass-with-no-tests`, so it fails when the tag selects no test. None of those tests needs
          # bank sync, a contract test keeps it so, and the job has no bank sync stack
          - { platform: arm64, runner: ubuntu-24.04-arm, projects: desktop, bank: "off", shard: 1, shards: 1, grep: "@arm64" }
          # Every test runs on amd64. Tablet and phone run only the tests that depend on the screen's
          # width or on touch, and `projects` lists the projects a job runs
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "off", shard: 1, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "off", shard: 2, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "off", shard: 3, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "off", shard: 4, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "off", shard: 5, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "off", shard: 6, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "off", shard: 7, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "off", shard: 8, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "off", shard: 9, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "off", shard: 10, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "off", shard: 11, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "on", shard: 1, shards: 3 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "on", shard: 2, shards: 3 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "on", shard: 3, shards: 3 }
          - { platform: amd64, runner: ubuntu-latest, projects: tablet, bank: "off", shard: 1, shards: 1 }
          - { platform: amd64, runner: ubuntu-latest, projects: phone, bank: "off", shard: 1, shards: 1 }
          - { platform: amd64, runner: ubuntu-latest, projects: tablet phone, bank: "on", shard: 1, shards: 1 }

    # Every matrix job starts its own application and database on its runner, once, and runs its tests
    # against them. With bank sync off, no provider is enabled and so no bank sync worker runs, which
    # is the server every test but those tagged as needing bank sync is written for. With it on, the
    # stack has SimpleFIN, Lunch Flow, Akahu, Pluggy and Enable Banking on, the worker running inside
    # the app as it does by default, and the fake SimpleFIN Bridge, Lunch Flow, Akahu, Pluggy and
    # Enable Banking the tagged tests connect bank accounts through
    env: &stack-env
      APP_IMAGE_TAG: ci
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: lumina
      DB_USER: lumina
      DB_PASSWORD: lumina-smoke
      COMPOSE_FILES: >-
        -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/fast-health.compose.yaml
        ${{ matrix.bank == 'on'
        && '-f e2e/fake-simplefin-bridge.compose.yaml -f e2e/fake-lunchflow.compose.yaml -f e2e/fake-akahu.compose.yaml -f e2e/fake-pluggy.compose.yaml -f e2e/fake-enable-banking.compose.yaml'
        || '-f e2e/no-bank-provider.compose.yaml' }}
        ${{ matrix.api == 'elsewhere' && '-f e2e/api-elsewhere.compose.yaml' || '' }}
      # Where the suite reaches the API. A job whose matrix entry says `api: elsewhere` has it on
      # port 8081 while the app stays on 8080, which is the address's origin the suite reads to take
      # the tests written for that mode. Every other job has it beneath the app's own address, where
      # the suite looks without being told
      API_URL: ${{ matrix.api == 'elsewhere' && 'http://localhost:8081/api' || 'http://localhost:8080/api' }}

    steps: &stack-steps
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare the image and env file
        uses: ./.github/actions/e2e-image
        with:
          platform: ${{ matrix.platform }}
          app-url: http://localhost:8080
          registry-username: ${{ vars.DOCKERHUB_USERNAME }}
          registry-token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # The stack starts with no pull, so an image missing here fails the job
      - name: Load the service images
        uses: ./.github/actions/service-images
        with:
          platform: ${{ matrix.platform }}

      # The stack mounts this build over the image's own, so it is in place before the stack starts
      - name: Fetch the frontend built for the API at another address
        if: ${{ matrix.api == 'elsewhere' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-api-elsewhere
          path: frontend/dist

      - name: Start the stack
        run: docker compose ${{ env.COMPOSE_FILES }} up -d --pull never

      # The app takes a while to migrate and seed its database, and this setup runs meanwhile
      - name: Set up the browser suite
        uses: ./.github/actions/e2e-browser
        with:
          cache-dependency-paths: e2e/package-lock.json

      - name: Wait for the stack
        uses: ./.github/actions/e2e-health
        with:
          health-url: ${{ env.API_URL }}/health
          compose-files: ${{ env.COMPOSE_FILES }}

      # The worker counts as running once its first scan for due work stamps its heartbeat. That
      # comes after it has waited for the app to migrate the database
      - name: Wait for bank sync
        if: ${{ matrix.bank == 'on' }}
        run: |
          compose="docker compose ${{ env.COMPOSE_FILES }}"
          for attempt in $(seq 1 150); do
            if ${compose} exec -T app python -m app.worker check-health \
              && curl -fsS -o /dev/null http://localhost:8790/docs \
              && curl -fsS -o /dev/null http://localhost:8791/docs \
              && curl -fsS -o /dev/null http://localhost:8792/docs \
              && curl -fsS -o /dev/null http://localhost:8793/docs \
              && curl -fsS -o /dev/null http://localhost:8794/docs; then
              echo "The bank sync worker and the fake SimpleFIN Bridge, Lunch Flow, Akahu, Pluggy and Enable Banking are running"
              exit 0
            fi
            echo "Attempt ${attempt}: bank sync not ready yet"
            sleep 1
          done
          echo "Bank sync never became ready, dumping logs"
          ${compose} logs app fake-simplefin-bridge fake-lunchflow fake-akahu fake-pluggy fake-enable-banking
          exit 1

      # A job runs one of the two steps below. In a run of the whole suite neither passes with no
      # tests, so a shard that selects none fails the job. A run of changed specs passes with none,
      # since a spec may hold no test for a job's stack or sizes
      - name: Run E2E tests with no bank provider
        id: no-bank-sync-tests
        if: ${{ matrix.bank == 'off' }}
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_API_BASE_URL: ${{ env.API_URL }}
          E2E_MAIL_API_URL: http://127.0.0.1:8025
          E2E_BANK_SYNC: "off"
          SPECS: ${{ inputs.specs }}
        run: |
          read -ra specs <<<"${SPECS}"
          npx playwright test "${specs[@]}" --project ${{ matrix.projects }} --shard=${{ matrix.shard }}/${{ matrix.shards }} ${{ matrix.grep && format('--grep {0}', matrix.grep) || '' }} ${{ inputs.specs != '' && '--pass-with-no-tests' || '' }}

      - name: Run E2E tests with bank sync
        id: bank-sync-tests
        if: ${{ matrix.bank == 'on' }}
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_API_BASE_URL: ${{ env.API_URL }}
          E2E_MAIL_API_URL: http://127.0.0.1:8025
          E2E_BANK_SYNC: "on"
          # Where the bank specs set up the fake SimpleFIN Bridge the stack syncs with
          E2E_FAKE_SIMPLEFIN_BRIDGE_URL: http://localhost:8790
          E2E_FAKE_LUNCHFLOW_URL: http://localhost:8791
          E2E_FAKE_AKAHU_URL: http://localhost:8792
          E2E_FAKE_PLUGGY_URL: http://localhost:8793
          E2E_FAKE_ENABLE_BANKING_URL: http://localhost:8794
          SPECS: ${{ inputs.specs }}
        run: |
          read -ra specs <<<"${SPECS}"
          npx playwright test "${specs[@]}" --project ${{ matrix.projects }} --shard=${{ matrix.shard }}/${{ matrix.shards }} ${{ matrix.grep && format('--grep {0}', matrix.grep) || '' }} ${{ inputs.specs != '' && '--pass-with-no-tests' || '' }}

      # The report shows only what the browser saw, so a failed request is explained by the app's own log
      - name: Dump container logs
        if: ${{ failure() && (steps.no-bank-sync-tests.outcome == 'failure' || steps.bank-sync-tests.outcome == 'failure') }}
        run: docker compose ${{ env.COMPOSE_FILES }} logs || true

      # Setup failures do not produce an E2E report
      - name: Keep the report from a failed run
        if: ${{ failure() && (steps.no-bank-sync-tests.outcome == 'failure' || steps.bank-sync-tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tests-${{ matrix.platform }}-${{ matrix.projects }}-bank-${{ matrix.bank }}-${{ matrix.shard }}${{ matrix.api == 'elsewhere' && '-api-elsewhere' || '' }}
          path: e2e/playwright-report
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose ${{ env.COMPOSE_FILES }} down -v

  # A pull request whose only browser suite changes are spec files runs those specs alone, with one
  # job for each kind of stack and no sharding. The arm64 job is left out, since the image it checks
  # is built from the same files as the base branch's
  changed:
    name: E2E tests (changed specs, ${{ matrix.projects }}${{ matrix.bank == 'on' && ', bank sync' || '' }})
    if: ${{ inputs.specs != '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "off", shard: 1, shards: 1, grep: "" }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, bank: "on", shard: 1, shards: 1, grep: "" }
          - { platform: amd64, runner: ubuntu-latest, projects: tablet phone, bank: "off", shard: 1, shards: 1, grep: "" }
          - { platform: amd64, runner: ubuntu-latest, projects: tablet phone, bank: "on", shard: 1, shards: 1, grep: "" }
    env: *stack-env
    steps: *stack-steps

  # The packaged image serves the app and the API from one origin. A stack that serves them from two
  # is built from the same image, and the frontend is built once for it here. Its jobs mount that
  # build over the image's own, which has the API beneath its own address
  frontend-api-elsewhere:
    name: Build the frontend for the API at another address
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The port is the one api-elsewhere.compose.yaml opens for the API
      - name: Build the frontend for the API on port 8081
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8081/api
        run: npm run build:app

      - name: Keep the build for the jobs that mount it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-api-elsewhere
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  # The tests that need two origins run on every pull request that runs the whole browser suite. A
  # run of the whole suite against an API elsewhere includes them in its shards, and a run of
  # changed specs has its own jobs below, so this one is left out of both
  across-origins:
    name: E2E tests (API elsewhere, tests needing two origins)
    needs: frontend-api-elsewhere
    if: ${{ inputs.specs == '' && !inputs.api-elsewhere }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 1, shards: 1, grep: "@across-origins" }
    env: *stack-env
    steps: *stack-steps

  # The same desktop tests as above, against a stack whose API answers at another address than the
  # app. The tests written for one address stay out and the three needing two come in, so the
  # shards are the desktop ones above
  test-api-elsewhere:
    name: E2E tests (API elsewhere, ${{ matrix.projects }}${{ matrix.bank == 'on' && ', bank sync' || '' }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: frontend-api-elsewhere
    if: ${{ inputs.specs == '' && inputs.api-elsewhere }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 1, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 2, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 3, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 4, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 5, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 6, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 7, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 8, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 9, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 10, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 11, shards: 11 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "on", shard: 1, shards: 3 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "on", shard: 2, shards: 3 }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "on", shard: 3, shards: 3 }
    env: *stack-env
    steps: *stack-steps

  # A pull request that changes only specs runs them against that stack too, with one job for each
  # kind of stack and no sharding, so a new test that works only beside the app's own address shows
  changed-api-elsewhere:
    name: E2E tests (changed specs, API elsewhere${{ matrix.bank == 'on' && ', bank sync' || '' }})
    needs: frontend-api-elsewhere
    if: ${{ inputs.specs != '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "off", shard: 1, shards: 1, grep: "" }
          - { platform: amd64, runner: ubuntu-latest, projects: desktop, api: elsewhere, bank: "on", shard: 1, shards: 1, grep: "" }
    env: *stack-env
    steps: *stack-steps
