# Added to docker/compose.yml for the browser tests: a fake Lunch Flow beside the app, and the
# testing-only setting that lets the app and the bank sync worker inside it reach the fake over plain
# HTTP on the Compose network, and nothing else. Compose reads relative paths in every file it merges from the first file's
# directory, docker/, so the mount below is written from there

x-fake-lunchflow-origin: &fake-lunchflow-origin http://fake-lunchflow:8791

services:
  app:
    environment:
      BANK_SYNC_LUNCHFLOW_TEST_ORIGIN: *fake-lunchflow-origin

  # Runs from the app's image, since it has everything the fake imports, with the fake's source
  # mounted from the checkout because the image leaves the tests out
  fake-lunchflow:
    image: "luminahq/lumina-finance:${APP_IMAGE_TAG:-latest}"
    entrypoint: ["uvicorn", "--app-dir", "/fake", "fake_lunchflow:app", "--host", "0.0.0.0", "--port", "8791"]
    volumes:
      - ../backend/tests/fake_lunchflow:/fake/fake_lunchflow:ro
    ports:
      - "127.0.0.1:8791:8791"
    # The image's check is of the app's web server, and this container doesn't run it. Nothing
    # waits on this one's health, since the workflow asks the fake itself through the published port
    healthcheck:
      disable: true
