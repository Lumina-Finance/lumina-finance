name: Backend lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The format check compares against the base branch
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # Run Ruff without installing backend dependencies
      - name: Run ruff
        run: uvx ruff check .

      # Only the files the pull request changes, in the directories make format-backend takes, so a
      # file the branch leaves alone never fails it
      - name: Check formatting of changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --relative --diff-filter=d "origin/$BASE_REF...HEAD" -- app tests scripts | grep '\.py$' || true)
          if [ -z "$files" ]; then
            echo "This pull request changes no Python files the formatter takes"
            exit 0
          fi
          uvx ruff format --diff $files
