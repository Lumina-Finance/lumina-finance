name: E2E tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: E2E tests (${{ matrix.platform }}, ${{ matrix.project }}${{ matrix.shards > 1 && format(', {0}/{1}', matrix.shard, matrix.shards) || '' }}${{ matrix.grep && ', tagged tests' || '' }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Every job is listed by hand, since the shard counts differ by project. With the cross-origin job
      # below they make 19 browser jobs. The organisation's plan runs 20 jobs at once, and the 8 backend
      # test jobs hold 8 of them while the browser jobs start, so a job past the free runners waits for
      # one. In a measured run with desktop in 8 shards, a desktop job spent about 98 seconds on setup
      # and 372 in its two test steps, the phone job took 467 seconds and tablet 378. arm64 runs one job
      # and gives up 7 runners, and they go to amd64: 5 to desktop for 13 shards, and 1 each to tablet
      # and phone for 2 shards. No single job then stays far longer than the rest
      matrix:
        include:
          # The one arm64 job, at desktop with only the tests tagged `ON_ARM64` in e2e/support/sizes.ts.
          # They cover the parts of the image compiled for the processor type. It passes no
          # `--pass-with-no-tests`, so it fails when the tag selects no test. None of those tests needs
          # bank sync, a contract test keeps it so, and the job skips the second run
          - { platform: arm64, runner: ubuntu-24.04-arm, project: desktop, shard: 1, shards: 1, grep: "@arm64" }
          # Every test runs on amd64. Tablet and phone run only the tests that depend on the screen's
          # width or on touch
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 1, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 2, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 3, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 4, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 5, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 6, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 7, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 8, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 9, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 10, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 11, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 12, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: desktop, shard: 13, shards: 13 }
          - { platform: amd64, runner: ubuntu-latest, project: tablet, shard: 1, shards: 2 }
          - { platform: amd64, runner: ubuntu-latest, project: tablet, shard: 2, shards: 2 }
          - { platform: amd64, runner: ubuntu-latest, project: phone, shard: 1, shards: 2 }
          - { platform: amd64, runner: ubuntu-latest, project: phone, shard: 2, shards: 2 }

    # Every matrix job starts its own application and database on its runner, and runs its tests
    # against two servers in turn. The arm64 job stops after the first. The first offers no bank sync,
    # with no provider enabled and so no bank sync worker, for every test but those tagged as needing
    # bank sync. The same stack then
    # restarts with SimpleFIN, Lunch Flow, Akahu, Pluggy and Enable Banking on, the worker running inside
    # the app as it does by default, and the fake SimpleFIN Bridge, Lunch Flow, Akahu, Pluggy and Enable
    # Banking the tagged tests connect bank accounts through
    env:
      APP_IMAGE_TAG: ci
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: lumina
      DB_USER: lumina
      DB_PASSWORD: lumina-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare the image and env file
        uses: ./.github/actions/e2e-image
        with:
          platform: ${{ matrix.platform }}
          app-url: http://localhost:8080
          registry-username: ${{ vars.DOCKERHUB_USERNAME }}
          registry-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # The stack starts with no pull, so an image missing here fails the job
      - name: Load the service images
        uses: ./.github/actions/service-images
        with:
          platform: ${{ matrix.platform }}

      - name: Start the stack with no bank provider
        run: docker compose -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/no-bank-provider.compose.yaml up -d --pull never

      # Overlap E2E setup with application migrations and seeding
      - name: Set up the browser suite
        uses: ./.github/actions/e2e-browser
        with:
          cache-dependency-paths: e2e/package-lock.json

      - name: Wait for the stack
        uses: ./.github/actions/e2e-health
        with:
          health-url: http://localhost:8080/api/health
          compose-files: -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/no-bank-provider.compose.yaml

      - name: Run E2E tests with no bank provider
        id: no-bank-sync-tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_MAIL_API_URL: http://127.0.0.1:8025
          E2E_BANK_SYNC: "off"
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} ${{ matrix.grep && format('--grep {0}', matrix.grep) || '' }}

      # The app restarts below, which ends the log of the server these tests ran against
      - name: Dump container logs from the server with no bank provider
        if: ${{ failure() && steps.no-bank-sync-tests.outcome == 'failure' }}
        run: docker compose -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/no-bank-provider.compose.yaml logs || true

      # The app is recreated with the bank providers on and the database kept. Every test creates its
      # own user, so nothing the first run wrote reaches the second. Runs after a failed first run
      # too, so a run reports both halves
      - name: Restart the stack with bank sync
        if: ${{ !cancelled() && !matrix.grep && steps.no-bank-sync-tests.outcome != 'skipped' }}
        run: docker compose -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/fake-simplefin-bridge.compose.yaml -f e2e/fake-lunchflow.compose.yaml -f e2e/fake-akahu.compose.yaml -f e2e/fake-pluggy.compose.yaml -f e2e/fake-enable-banking.compose.yaml up -d --pull never

      - name: Wait for the stack with bank sync
        if: ${{ !cancelled() && !matrix.grep && steps.no-bank-sync-tests.outcome != 'skipped' }}
        uses: ./.github/actions/e2e-health
        with:
          health-url: http://localhost:8080/api/health
          compose-files: -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/fake-simplefin-bridge.compose.yaml -f e2e/fake-lunchflow.compose.yaml -f e2e/fake-akahu.compose.yaml -f e2e/fake-pluggy.compose.yaml -f e2e/fake-enable-banking.compose.yaml

      # The worker counts as running once its first scan for due work stamps its heartbeat. That
      # comes after it has waited for the app to migrate the database
      - name: Wait for bank sync
        if: ${{ !cancelled() && !matrix.grep && steps.no-bank-sync-tests.outcome != 'skipped' }}
        run: |
          compose="docker compose -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/fake-simplefin-bridge.compose.yaml -f e2e/fake-lunchflow.compose.yaml -f e2e/fake-akahu.compose.yaml -f e2e/fake-pluggy.compose.yaml -f e2e/fake-enable-banking.compose.yaml"
          for attempt in $(seq 1 30); do
            if ${compose} exec -T app python -m app.worker check-health \
              && curl -fsS -o /dev/null http://localhost:8790/docs \
              && curl -fsS -o /dev/null http://localhost:8791/docs \
              && curl -fsS -o /dev/null http://localhost:8792/docs \
              && curl -fsS -o /dev/null http://localhost:8793/docs \
              && curl -fsS -o /dev/null http://localhost:8794/docs; then
              echo "The bank sync worker and the fake SimpleFIN Bridge, Lunch Flow, Akahu, Pluggy and Enable Banking are running"
              exit 0
            fi
            echo "Attempt ${attempt}: bank sync not ready yet"
            sleep 5
          done
          echo "Bank sync never became ready, dumping logs"
          ${compose} logs app fake-simplefin-bridge fake-lunchflow fake-akahu fake-pluggy fake-enable-banking
          exit 1

      # A shard can hold none of the tests needing bank sync, so finding none passes. The report and
      # results go beside the first run's
      - name: Run E2E tests with bank sync
        id: bank-sync-tests
        if: ${{ !cancelled() && !matrix.grep && steps.no-bank-sync-tests.outcome != 'skipped' }}
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_MAIL_API_URL: http://127.0.0.1:8025
          E2E_BANK_SYNC: "on"
          # Where the bank specs set up the fake SimpleFIN Bridge the stack syncs with
          E2E_FAKE_SIMPLEFIN_BRIDGE_URL: http://localhost:8790
          E2E_FAKE_LUNCHFLOW_URL: http://localhost:8791
          E2E_FAKE_AKAHU_URL: http://localhost:8792
          E2E_FAKE_PLUGGY_URL: http://localhost:8793
          E2E_FAKE_ENABLE_BANKING_URL: http://localhost:8794
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-bank-sync
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --pass-with-no-tests --output=test-results-bank-sync

      # The report shows only what the browser saw, so a failed request is explained by the app's own log
      - name: Dump container logs from the server with bank sync
        if: ${{ failure() && steps.bank-sync-tests.outcome == 'failure' }}
        run: docker compose -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/fake-simplefin-bridge.compose.yaml -f e2e/fake-lunchflow.compose.yaml -f e2e/fake-akahu.compose.yaml -f e2e/fake-pluggy.compose.yaml -f e2e/fake-enable-banking.compose.yaml logs || true

      # Setup failures do not produce an E2E report
      - name: Keep the reports from a failed run
        if: ${{ failure() && (steps.no-bank-sync-tests.outcome == 'failure' || steps.bank-sync-tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tests-${{ matrix.platform }}-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/playwright-report-bank-sync
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/fake-simplefin-bridge.compose.yaml -f e2e/fake-lunchflow.compose.yaml -f e2e/fake-akahu.compose.yaml -f e2e/fake-pluggy.compose.yaml -f e2e/fake-enable-banking.compose.yaml down -v

  # The packaged image serves the app and the API from one origin, so the tests that need two run
  # here. The frontend is built a second time to reach the API at another address of the same stack,
  # and mounted over the image's. This job needs only the image, so it runs beside the matrix above
  cross-origin:
    name: E2E tests (cross-origin)
    runs-on: ubuntu-latest

    env:
      APP_IMAGE_TAG: ci
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: lumina
      DB_USER: lumina
      DB_PASSWORD: lumina-smoke
      # The same stack answers on two ports, so the API is another origin from the app. It stays on the
      # same host because the refresh cookie is SameSite=Lax, which a request from localhost to
      # 127.0.0.1 would not carry, and the session would never start
      APP_ORIGIN: http://localhost:8080
      API_URL: http://localhost:8081/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # APP_URL is the origin the API allows, so the app on port 8080 may call it on port 8081
      - name: Prepare the image and env file
        uses: ./.github/actions/e2e-image
        with:
          platform: amd64
          app-url: ${{ env.APP_ORIGIN }}
          registry-username: ${{ vars.DOCKERHUB_USERNAME }}
          registry-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Load the service images
        uses: ./.github/actions/service-images
        with:
          platform: amd64

      # Set up before the frontend build, which needs Node too. The stack starts after that build,
      # since it mounts the result
      - name: Set up the browser suite
        uses: ./.github/actions/e2e-browser
        with:
          cache-dependency-paths: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the frontend for the second origin
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.API_URL }}
        run: npm run build:app

      - name: Mount that build and open the second port
        run: |
          cat > docker/compose.cross-origin.yml <<EOF
          services:
            app:
              ports:
                - "8081:80"
              volumes:
                - ${GITHUB_WORKSPACE}/frontend/dist:/srv/lumina/frontend:ro
          EOF

      - name: Start the stack
        run: docker compose -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/no-bank-provider.compose.yaml -f docker/compose.cross-origin.yml up -d --pull never

      - name: Wait for the stack
        uses: ./.github/actions/e2e-health
        with:
          health-url: ${{ env.API_URL }}/health
          compose-files: -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/no-bank-provider.compose.yaml -f docker/compose.cross-origin.yml

      - name: Run E2E tests
        id: e2e-tests
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ env.APP_ORIGIN }}
          E2E_API_BASE_URL: ${{ env.API_URL }}
          E2E_MAIL_API_URL: http://127.0.0.1:8025
          # None of these tests needs bank sync, so the stack offers none
          E2E_BANK_SYNC: "off"
        run: npx playwright test --project=cross-origin

      - name: Dump container logs
        if: failure()
        run: docker compose -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/no-bank-provider.compose.yaml -f docker/compose.cross-origin.yml logs || true

      - name: Keep the report from a failed run
        if: ${{ failure() && steps.e2e-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tests-cross-origin
          path: e2e/playwright-report
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker/compose.yml -f e2e/compose.mail.yaml -f e2e/no-bank-provider.compose.yaml -f docker/compose.cross-origin.yml down -v
