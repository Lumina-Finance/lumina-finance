name: Pull request checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      lockfiles: ${{ steps.filter.outputs.lockfiles }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            # Workflow edits exercise the pipeline they change
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            # E2E and Docker jobs exercise these tests and composite actions
            docker:
              - 'docker/**'
              - 'e2e/**'
              - '.github/workflows/**'
              - '.github/actions/**'

            # Dependency changes exercise the full pipeline
            lockfiles:
              - 'backend/uv.lock'
              - 'frontend/package-lock.json'

  backend-lint:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.lockfiles == 'true' }}
    uses: ./.github/workflows/_backend-lint.yml

  backend-test:
    needs: [changes, backend-lint]
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.lockfiles == 'true' }}
    uses: ./.github/workflows/_backend-test.yml

  frontend-lint:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.lockfiles == 'true' }}
    uses: ./.github/workflows/_frontend-lint.yml

  frontend-test:
    needs: [changes, frontend-lint]
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.lockfiles == 'true' }}
    uses: ./.github/workflows/_frontend-test.yml

  frontend-build:
    needs: [changes, frontend-test]
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.lockfiles == 'true' }}
    uses: ./.github/workflows/_frontend-build.yml

  # Allow checks skipped by path filters, but block failed checks and cancelled runs
  docker-build:
    needs: [changes, backend-lint, backend-test, frontend-lint, frontend-test, frontend-build]
    if: >-
      ${{ !cancelled()
        && needs.backend-lint.result != 'failure'
        && needs.backend-test.result != 'failure'
        && needs.frontend-lint.result != 'failure'
        && needs.frontend-test.result != 'failure'
        && needs.frontend-build.result != 'failure'
        && (needs.changes.outputs.backend == 'true'
            || needs.changes.outputs.frontend == 'true'
            || needs.changes.outputs.docker == 'true'
            || needs.changes.outputs.lockfiles == 'true') }}
    uses: ./.github/workflows/_docker-build.yml
    secrets: inherit

  e2e-test:
    needs: docker-build
    if: ${{ !cancelled() && needs.docker-build.result == 'success' }}
    uses: ./.github/workflows/_e2e-test.yml
    secrets: inherit

  # Keep this name stable for the repository's required status check
  # Jobs skipped by path filters are allowed, but failures and cancellations block merging
  pr-gate:
    name: PR gate
    needs:
      - changes
      - backend-lint
      - backend-test
      - frontend-lint
      - frontend-test
      - frontend-build
      - docker-build
      - e2e-test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required branch passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Branch results: ${results}"
          for result in ${results}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "A required branch did not pass"
              exit 1
            fi
          done
          echo "All required branches passed or were skipped"
