name: Backend tests

on:
  workflow_call:
    inputs:
      tests:
        description: Test files to run alone on one runner, relative to backend and separated by spaces. Empty runs the whole suite in eight groups
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The groups start at once, with no job ahead of them filling the uv cache. The cache is saved from
  # main for every pull request, and a group finding none installs the dependencies itself
  test:
    name: ${{ inputs.tests == '' && format('Test backend {0} of 8', matrix.group) || 'Test backend changed tests' }}
    runs-on: ubuntu-latest

    # Eight groups leave room for the browser tests within the free plan's 20 jobs at once.
    # pytest-split evens them out by the run times in backend/.test_durations. One failed group
    # cancels the others, since the run can no longer pass
    strategy:
      fail-fast: true
      matrix:
        group: ${{ fromJSON(inputs.tests == '' && '[1, 2, 3, 4, 5, 6, 7, 8]' || '[1]') }}

    defaults:
      run:
        working-directory: backend

    env:
      TESTING: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: lumina_test
      DB_USER: lumina_test
      DB_PASSWORD: lumina_test
      MIGRATOR_DB_PASSWORD: lumina_migrator
      APP_DB_PASSWORD: lumina_app
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: lumina_test
      TEST_DB_USER: lumina_test
      TEST_DB_PASSWORD: lumina_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The same uv as UV_VERSION in docker/Dockerfile
          version: "0.13.7"
          enable-cache: true

      - name: Load the service images
        uses: ./.github/actions/service-images
        with:
          platform: amd64

      # The databases start from the shared images with no pull, so an image missing here fails the job.
      # The database lives in memory to reduce test I/O, and the cache tests run against a real ValKey,
      # found at the default TEST_VALKEY_URL in tests/.env.test
      - name: Start the databases
        run: |
          docker run -d --pull never --name postgres \
            -e POSTGRES_DB=lumina_test -e POSTGRES_USER=lumina_test -e POSTGRES_PASSWORD=lumina_test \
            -p 5432:5432 --tmpfs /var/lib/postgresql/data \
            --health-cmd "pg_isready -U lumina_test -d lumina_test" \
            --health-interval 2s --health-timeout 3s --health-retries 10 --health-start-period 5s \
            postgres:17
          docker run -d --pull never --name valkey \
            -p 6379:6379 \
            --health-cmd "valkey-cli ping" \
            --health-interval 2s --health-timeout 3s --health-retries 10 \
            valkey/valkey:9-alpine

      - name: Wait for the databases
        run: |
          for attempt in $(seq 1 60); do
            postgres=$(docker inspect --format '{{.State.Health.Status}}' postgres)
            valkey=$(docker inspect --format '{{.State.Health.Status}}' valkey)
            if [ "${postgres}" = healthy ] && [ "${valkey}" = healthy ]; then
              echo "The databases are healthy"
              exit 0
            fi
            echo "Attempt ${attempt}: postgres is ${postgres}, valkey is ${valkey}"
            sleep 2
          done
          echo "The databases never became healthy, dumping logs"
          docker logs postgres
          docker logs valkey
          exit 1

      # Tests need the restricted app role to exercise row-level security
      # Provisioning loads auth configuration, so it also needs temporary JWT keys
      - name: Provision the migrator and app roles
        run: |
          mkdir -p "${RUNNER_TEMP}/jwt-keys"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "${RUNNER_TEMP}/jwt-keys/access.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "${RUNNER_TEMP}/jwt-keys/refresh.pem"
          uv run python -m app.db.provision ensure-roles
        env:
          JWT_ACCESS_PRIVATE_KEY_PATH: ${{ runner.temp }}/jwt-keys/access.pem
          JWT_REFRESH_PRIVATE_KEY_PATH: ${{ runner.temp }}/jwt-keys/refresh.pem

      # The workers leave one CPU to the Postgres and ValKey containers they query, so busy workers
      # never starve the databases behind each test. Each group then writes the times of its own tests
      # alone to its copy of the durations file, so the copies of all eight combine into a complete file.
      # Splitting by least duration spreads the many short tests over every group, since each test also
      # costs a little time its recorded duration misses. A run of the changed test files alone keeps
      # no durations, since they would cover only those files
      - name: Run tests
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          if [ -n "${TESTS}" ]; then
            read -ra tests <<<"${TESTS}"
            uv run pytest -n "$(( $(nproc) - 1 ))" "${tests[@]}"
          else
            uv run pytest -n "$(( $(nproc) - 1 ))" tests --splits 8 --group ${{ matrix.group }} --splitting-algorithm least_duration --store-durations --clean-durations
          fi

      - name: Keep this group's test durations
        if: ${{ inputs.tests == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-durations-${{ matrix.group }}
          path: backend/.test_durations
          include-hidden-files: true
          retention-days: 7
