name: Build and publish the Docker image

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/lumina-finance

jobs:
  build:
    name: Build Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}

    # Each leg builds on a runner of its own architecture, so neither is emulated. One
    # architecture failing leaves the other's digest pushed but untagged, and the merge
    # job below is skipped, so a failed release publishes no tags at all
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker build
        uses: ./.github/actions/docker-build-setup
        with:
          registry-username: ${{ vars.DOCKERHUB_USERNAME }}
          registry-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the labels are wanted here, they are stamped onto each architecture as it is
      # built. The tags belong to the manifest list and are applied in the merge job
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      # Push untagged and report the digest, so the merge job can gather one digest per
      # architecture into a single tagged manifest list
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}

      # The digest is carried as a filename on an empty file, so the merge job learns every
      # architecture's digest by listing the directory
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the multi-architecture image
    needs: build
    runs-on: ubuntu-latest

    steps:
      # The composite action below is read from the repository, so it has to be checked out
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker build
        uses: ./.github/actions/docker-build-setup
        with:
          registry-username: ${{ vars.DOCKERHUB_USERNAME }}
          registry-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}

      # Point every release tag at one manifest list holding both architecture digests,
      # which is what makes a client pull the image matching its own hardware
      - name: Assemble the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
