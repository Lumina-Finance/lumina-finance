name: Smoke test

# Reusable step invoked by the pull request pipeline, it does not trigger on its own
on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test Docker image
    runs-on: ubuntu-latest

    # Feed docker/compose.yml the built image tag and a throwaway database identity
    env:
      APP_IMAGE_TAG: ci
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: lumina
      DB_USER: lumina
      DB_PASSWORD: lumina-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image into the daemon
        run: docker load -i image.tar

      - name: Start the stack
        run: docker compose -f docker/compose.yml up -d

      # Caddy serves the backend health route under /api, poll until the app reports ready
      - name: Ping the health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health | grep -qE '"status":\s*"ok"'; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt ${attempt}: app not ready yet"
            sleep 5
          done
          echo "Health check never succeeded, dumping logs"
          docker compose -f docker/compose.yml logs
          exit 1

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker/compose.yml down -v
