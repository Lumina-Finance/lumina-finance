# Added to docker/compose.yml for the browser tests: a fake Enable Banking beside the app, and the
# testing-only setting that lets the app and the bank sync worker inside it reach the fake over plain
# HTTP on the Compose network, and nothing else. The browser reaches the fake's bank page on the
# published port, so the fake is told that address as its public origin. Compose reads relative paths in
# every file it merges from the first file's directory, docker/, so the mount below is written from there

x-fake-enable-banking-origin: &fake-enable-banking-origin http://fake-enable-banking:8794

services:
  app:
    environment:
      BANK_SYNC_ENABLE_BANKING_TEST_ORIGIN: *fake-enable-banking-origin

  # Runs from the app's image, as it has everything the fake imports, with the fake's source mounted
  # from the checkout since the image leaves the tests out
  fake-enable-banking:
    image: "luminahq/lumina-finance:${APP_IMAGE_TAG:-latest}"
    entrypoint: ["uvicorn", "--app-dir", "/fake", "fake_enable_banking:app", "--host", "0.0.0.0", "--port", "8794"]
    environment:
      FAKE_ENABLE_BANKING_PUBLIC_ORIGIN: http://localhost:8794
    volumes:
      - ../backend/tests/fake_enable_banking:/fake/fake_enable_banking:ro
    ports:
      - "127.0.0.1:8794:8794"
    # The image's check is for the app's web server, and this container doesn't run it. Nothing
    # waits on this one's health, since the workflow asks the fake itself through the published port
    healthcheck:
      disable: true
