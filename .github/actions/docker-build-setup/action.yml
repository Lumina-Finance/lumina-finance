name: Set up Docker build
description: Signs in to both image registries and prepares the Buildx builder

inputs:
  registry-username:
    description: Account name, shared by Docker Hub and the hardened images registry
    required: true
  registry-token:
    description: Access token, shared by Docker Hub and the hardened images registry. Read-only unless the job publishes
    required: true

runs:
  using: composite

  steps:
    - name: Log in to Docker Hub
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-token }}

    # The base images live in Docker Hardened Images so the build needs this registry too
    - name: Log in to Docker Hardened Images
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: dhi.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-token }}

    # The runner is thrown away after the job, so removing the builder at the end only adds a wait
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        cleanup: false
