services:
  app:
    image: "luminahq/lumina-finance:${APP_IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:80"
    env_file:
      - .env
    # Caches exchange rates in the valkey service below. It is deliberately not in depends_on, since the app
    # starts and works without a cache. An unset VALKEY_URL points at the service, and setting it blank in
    # .env turns the cache off
    environment:
      VALKEY_URL: "${VALKEY_URL-valkey://valkey:6379}"
    volumes:
      - lumina_data:/data

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:?DB_NAME is required}"
      POSTGRES_USER: "${DB_USER:?DB_USER is required}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # A cache, so it keeps nothing on disk and a restart just empties it. The memory cap with eviction means
  # it never refuses a write when full. It publishes no port, so only the app can reach it
  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lumina_data:
  postgres_data:
