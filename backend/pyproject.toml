[project]
name = "lumina-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.19.2",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mangum>=0.22.0",
    "pydantic[email]>=2.13.5",
    "pyjwt[crypto]>=2.13.0",
    "pyotp>=2.10.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    # DO NOT REMOVE: required for timezone (see app/__init__.py)
    "tzdata>=2026.3",
    "uvicorn>=0.52.4",
    "webauthn>=3.0.0",
]

[dependency-groups]
dev = [
    "cbor2>=6.1.4",
    "freezegun>=1.5.5",
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-split>=0.11.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.7",
]

[tool.uv]
constraint-dependencies = [
    "idna>=3.19",
    "mako>=1.4.1",
    "starlette>=1.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 144
exclude = ["alembic"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "RUF", "S", "UP", "W"]
ignore = ["D415"]  # House style omits trailing punctuation in docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D104", "S101", "S105", "S106"]  # tests can omit package docstrings and use assert with sample credentials
"app/schemas/auth.py" = ["S105"]  # bearer token type is response metadata, not a hardcoded password
"app/db/rls/functions.py" = ["S608"]  # function bodies are built only from trusted name constants, never user input, and cannot take inline noqa inside the SQL
