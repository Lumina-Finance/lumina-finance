# Added to docker/compose.yml for the browser tests: a fake SimpleFIN Bridge beside the app, and the
# testing-only setting that lets the app and the bank sync worker inside it reach the fake over plain
# HTTP on the Compose network, and nothing else. Compose reads relative paths in every file it merges from the first file's
# directory, docker/, so the mount below is written from there

x-fake-simplefin-bridge-origin: &fake-simplefin-bridge-origin http://fake-simplefin-bridge:8790

services:
  app:
    environment:
      BANK_SYNC_SIMPLEFIN_TEST_ORIGIN: *fake-simplefin-bridge-origin

  # Runs from the app's image, since it has everything the fake imports, with the fake's source mounted
  # from the checkout since the image leaves the tests out. It reads the app's origin for it too, so
  # a setup token a browser test mints through the published port still sends the app's claim to an
  # address the app can reach
  fake-simplefin-bridge:
    image: "luminahq/lumina-finance:${APP_IMAGE_TAG:-latest}"
    entrypoint: ["uvicorn", "--app-dir", "/fake", "fake_simplefin_bridge:app", "--host", "0.0.0.0", "--port", "8790"]
    environment:
      BANK_SYNC_SIMPLEFIN_TEST_ORIGIN: *fake-simplefin-bridge-origin
    volumes:
      - ../backend/tests/fake_simplefin_bridge:/fake/fake_simplefin_bridge:ro
    ports:
      - "127.0.0.1:8790:8790"
    # The image's check is of the app's web server. This container doesn't run one, and nothing
    # waits on this one's health, since the workflow asks the fake itself through the published port
    healthcheck:
      disable: true
