name: Docker build

# Reusable step invoked by the pull request pipeline, it does not trigger on its own
on:
  workflow_call:

permissions:
  contents: read

env:
  # Fixed local tag the smoke test reuses, it matches the image name in docker/compose.yml
  IMAGE_REF: luminahq/lumina-finance:ci

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The base images live in Docker Hardened Images so the build needs this registry too
      - name: Log in to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Load the image into the local daemon instead of pushing so the smoke test can run it
      - name: Build image
        uses: docker/build-push-action@v7
        env:
          # The build record artifact is unused here and would linger past the image tarball
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            APP_VERSION=ci

      - name: Save image to a tarball
        run: docker save ${{ env.IMAGE_REF }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: image.tar
          retention-days: 1
