services:
  app:
    image: "luminahq/lumina-finance:${APP_IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      - lumina_data:/data

  # Runs bank sync jobs, from the same image and settings as the app. It waits for the app to set
  # up the database, so it can start alongside it. Its health check follows the heartbeat each
  # scan for due work records, replacing the image's check of the web server this container
  # doesn't run, and init passes the stop signal on so the worker stops at once
  worker:
    image: "luminahq/lumina-finance:${APP_IMAGE_TAG:-latest}"
    restart: unless-stopped
    command: worker
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - lumina_data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "check-health"]
      interval: 1m
      timeout: 10s
      start_period: 5m
      retries: 3

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:?DB_NAME is required}"
      POSTGRES_USER: "${DB_USER:?DB_USER is required}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Cache for foreign exchange rates
  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lumina_data:
  postgres_data:
