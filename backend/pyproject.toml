[project]
name = "lumina-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.2",
    "greenlet>=3.3.2",
    "httpx>=0.28.1",
    "mangum>=0.21.0",
    "pydantic[email]>=2.12.5",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.8",
]

[tool.uv]
constraint-dependencies = [
    "idna>=3.15",
    "mako>=1.3.12",
    "starlette>=1.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 144
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "RUF", "S", "UP", "W"]
ignore = ["D415"]  # House style omits trailing punctuation in docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert and test credentials are expected in tests
"app/schemas/auth.py" = ["S105"]  # token_type = "bearer" is not a hardcoded password
