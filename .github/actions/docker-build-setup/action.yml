name: Set up Docker build
description: Signs in to both image registries and prepares the Buildx builder

inputs:
  registry-username:
    description: Account name, shared by Docker Hub and the hardened images registry
    required: true
  registry-token:
    description: Access token, shared by Docker Hub and the hardened images registry
    required: true

runs:
  using: composite

  steps:
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-token }}

    # The base images live in Docker Hardened Images so the build needs this registry too
    - name: Log in to Docker Hardened Images
      uses: docker/login-action@v4
      with:
        registry: dhi.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
