<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#F2EDE4;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0F0E0C">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;padding:32px">
            <tr>
              <td style="font-size:18px;font-weight:600;padding-bottom:16px">{{ app_name }}</td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:22px">{% block content %}{% endblock %}</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
