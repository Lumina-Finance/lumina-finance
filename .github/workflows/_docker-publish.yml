name: Docker publish

on:
  workflow_call:
    inputs:
      app-version:
        description: Version stamped into the image and shown in the app footer
        required: true
        type: string
      tags:
        description: Docker metadata tag rules, one per line, applied to the combined manifest
        required: true
        type: string
      flavor:
        description: Docker metadata flavor, which decides whether latest is added
        required: true
        type: string
      environment:
        description: Deployment environment that holds the Docker Hub push token and decides who may run the jobs
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/lumina-finance

jobs:
  build:
    name: Build Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}

    # The push token is a secret of this environment, so only jobs that name it can read the token
    environment: ${{ inputs.environment }}

    # Build natively and publish tags only after both architectures succeed
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker build
        uses: ./.github/actions/docker-build-setup
        with:
          registry-username: ${{ vars.DOCKERHUB_USERNAME }}
          registry-token: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}

      # Apply labels to each image and tags to the combined manifest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ inputs.app-version }}

      # Artifact filenames carry the digests consumed by manifest assembly
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the multi-architecture image
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker build
        uses: ./.github/actions/docker-build-setup
        with:
          registry-username: ${{ vars.DOCKERHUB_USERNAME }}
          registry-token: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}
          flavor: ${{ inputs.flavor }}

      # Every tag references both architecture digests
      - name: Assemble the manifest list
        working-directory: /tmp/digests
        run: |
          # Each tag flag and digest has to reach the command as its own word
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
