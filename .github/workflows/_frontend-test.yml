name: Frontend tests

on:
  workflow_call:
    inputs:
      tests:
        description: Test files to run alone, relative to frontend and separated by spaces. Empty runs the whole suite
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest suite
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          read -ra tests <<<"${TESTS}"
          npm run test -- "${tests[@]}"
