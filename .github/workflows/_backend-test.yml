name: Backend tests

# Reusable step invoked by the pull request pipeline, it does not trigger on its own
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test backend ${{ matrix.suite.name }}
    runs-on: ubuntu-latest

    # Each suite runs as its own parallel job against a dedicated database, the
    # config update checks live with models and migrations so no test is dropped
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: models, migrations, and configs
            paths: tests/models tests/migrations tests/test_config_update_checks.py
          - name: routes
            paths: tests/routes
          - name: services
            paths: tests/services

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lumina_test
          POSTGRES_USER: lumina_test
          POSTGRES_PASSWORD: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina_test -d lumina_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      TESTING: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: lumina_test
      DB_USER: lumina_test
      DB_PASSWORD: lumina_test
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: lumina_test
      TEST_DB_USER: lumina_test
      TEST_DB_PASSWORD: lumina_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Run tests
        run: uv run pytest -n auto ${{ matrix.suite.paths }}
