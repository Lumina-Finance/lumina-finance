name: E2E tests

on:
  workflow_call:
    inputs:
      every-size-on-arm64:
        description: Run the tablet and phone projects on arm64 too, which pull requests leave to the weekly run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: E2E tests (${{ matrix.target.platform }}, ${{ matrix.project }}${{ matrix.project == 'desktop' && format(', {0}/4', matrix.shard) || '' }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
        project: [desktop, tablet, phone]
        # Desktop holds most of the suite, so it splits across four runners. Tablet and phone are
        # short enough that the setup each runner repeats would cost more than splitting saves
        shard: [1, 2, 3, 4]
        # Tablet and phone keep shard 1 only. A pull request also runs arm64 at desktop only, and the
        # weekly run takes arm64 at every size
        exclude: ${{ fromJSON(format('[{0}{1}]', '{"project":"tablet","shard":2},{"project":"tablet","shard":3},{"project":"tablet","shard":4},{"project":"phone","shard":2},{"project":"phone","shard":3},{"project":"phone","shard":4}', inputs.every-size-on-arm64 && '' || ',{"target":{"platform":"arm64","runner":"ubuntu-24.04-arm"},"project":"tablet"},{"target":{"platform":"arm64","runner":"ubuntu-24.04-arm"},"project":"phone"}')) }}

    # Every matrix job starts its own application and database on its runner
    env:
      APP_IMAGE_TAG: ci
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: lumina
      DB_USER: lumina
      DB_PASSWORD: lumina-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the native image
        uses: actions/download-artifact@v8
        with:
          name: e2e-image-${{ matrix.target.platform }}
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "${RUNNER_TEMP}/lumina-image.tar"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # APP_URL gives passkeys their domain, as an operator's deploy does, so the passkey flows run
      - name: Write the operator env file
        run: |
          cat > docker/.env <<EOF
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          APP_URL=http://localhost:8080
          EOF

      - name: Start the stack
        run: docker compose -f docker/compose.yml up -d

      # Overlap E2E setup with application migrations and seeding
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26.10"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --ignore-scripts

      # E2E tests have a separate TypeScript project from the frontend
      - name: Type-check E2E tests
        working-directory: e2e
        run: npm run typecheck

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Ping the health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health | grep -qE '"status":\s*"ok"'; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt ${attempt}: app not ready yet"
            sleep 5
          done
          echo "Health check never succeeded, dumping logs"
          docker compose -f docker/compose.yml logs
          exit 1

      - name: Run E2E tests
        id: e2e-tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm test -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.project == 'desktop' && 4 || 1 }}

      # The report shows only what the browser saw, so a failed request is explained by the app's own log
      - name: Dump container logs
        if: failure()
        run: docker compose -f docker/compose.yml logs || true

      # Setup failures do not produce an E2E report
      - name: Keep the report from a failed run
        if: ${{ failure() && steps.e2e-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tests-${{ matrix.target.platform }}-${{ matrix.project }}-${{ matrix.shard }}
          path: e2e/playwright-report
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker/compose.yml down -v
