name: Docker build

on:
  workflow_call:
    inputs:
      save-cache:
        description: Save the build's layers for later builds to read. Only a run on main saves them
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Must match the Compose app image when APP_IMAGE_TAG is ci
  IMAGE_REF: luminahq/lumina-finance:ci

jobs:
  build:
    name: Build Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}

    # Build natively and retain results from both architectures if either fails
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker build
        uses: ./.github/actions/docker-build-setup
        with:
          registry-username: ${{ vars.DOCKERHUB_USERNAME }}
          registry-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Export once per architecture so each device job tests the same image without rebuilding it.
      # Layers saved from main are read, so a build with unchanged lockfiles installs no dependency
      # again. A pull request can read main's saved layers and never another pull request's, and
      # saving from each one would fill the repository's cache storage, so only the run on main saves
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Only the image artifact is needed by downstream jobs
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/${{ matrix.platform }}
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/lumina-image.tar
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            APP_VERSION=ci
          cache-from: type=gha,scope=app-image-${{ matrix.platform }}
          cache-to: ${{ inputs.save-cache && format('type=gha,mode=max,scope=app-image-{0}', matrix.platform) || '' }}

      - name: Share the built image with E2E jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-image-${{ matrix.platform }}
          path: ${{ runner.temp }}/lumina-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
