name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      lockfiles: ${{ steps.filter.outputs.lockfiles }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            docker:
              - 'docker/**'

            # A lockfile change can shift transitive dependencies that affect the
            # other side or the built image, so it forces the whole pipeline to run
            lockfiles:
              - 'backend/uv.lock'
              - 'frontend/package-lock.json'

  backend-lint:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.lockfiles == 'true' }}
    uses: ./.github/workflows/_backend-lint.yml

  backend-test:
    needs: [changes, backend-lint]
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.lockfiles == 'true' }}
    uses: ./.github/workflows/_backend-test.yml

  frontend-lint:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.lockfiles == 'true' }}
    uses: ./.github/workflows/_frontend-lint.yml

  frontend-test:
    needs: [changes, frontend-lint]
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.lockfiles == 'true' }}
    uses: ./.github/workflows/_frontend-test.yml

  frontend-build:
    needs: [changes, frontend-test]
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.lockfiles == 'true' }}
    uses: ./.github/workflows/_frontend-build.yml

  # Build whenever backend, frontend, or docker changed, as long as no upstream
  # branch failed, a skipped branch means that side was untouched and is fine
  docker-build:
    needs: [changes, backend-lint, backend-test, frontend-lint, frontend-test, frontend-build]
    if: >-
      ${{ !cancelled()
        && needs.backend-lint.result != 'failure'
        && needs.backend-test.result != 'failure'
        && needs.frontend-lint.result != 'failure'
        && needs.frontend-test.result != 'failure'
        && needs.frontend-build.result != 'failure'
        && (needs.changes.outputs.backend == 'true'
            || needs.changes.outputs.frontend == 'true'
            || needs.changes.outputs.docker == 'true'
            || needs.changes.outputs.lockfiles == 'true') }}
    uses: ./.github/workflows/_docker-build.yml
    secrets: inherit

  smoke-test:
    needs: docker-build
    if: ${{ !cancelled() && needs.docker-build.result == 'success' }}
    uses: ./.github/workflows/_smoke_test_docker_image.yml

  # Single required status check, it fails if any branch failed or was cancelled
  # while treating path skipped branches as a pass
  pr-gate:
    name: PR gate
    needs:
      - changes
      - backend-lint
      - backend-test
      - frontend-lint
      - frontend-test
      - frontend-build
      - docker-build
      - smoke-test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required branch passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Branch results: ${results}"
          for result in ${results}; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              echo "A required branch did not pass"
              exit 1
            fi
          done
          echo "All required branches passed or were skipped"
