version: 2

registries:
  docker-hardened-images:
    type: docker-registry
    url: https://dhi.io
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_TOKEN}}

updates:
  - package-ecosystem: uv
    directory: /backend
    cooldown:
      default-days: 14
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 14
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Toronto
    assignees: ["OKok-3"]
    open-pull-requests-limit: 1
    groups:
      uv-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /frontend
      - /e2e
    cooldown:
      default-days: 14
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 14
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Toronto
    assignees: ["OKok-3"]
    open-pull-requests-limit: 1
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    registries:
      - docker-hardened-images
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Toronto
    assignees: ["OKok-3"]
    open-pull-requests-limit: 1
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/docker-build-setup
      - /.github/actions/e2e-image
      - /.github/actions/e2e-browser
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Toronto
    assignees: ["OKok-3"]
    open-pull-requests-limit: 1
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
